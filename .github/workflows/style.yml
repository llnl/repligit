name: Linting & Style Checks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/requirements/unit-tests.txt
            .github/workflows/requirements/style.txt

      - name: Install Python dependencies
        run: |
          pip install -r .github/workflows/requirements/unit-tests.txt
          pip install -r .github/workflows/requirements/style.txt
          pip install -e .[aiohttp]

      - name: Run Ruff
        run: |
          ruff check --diff
          ruff check --select I --diff
          ruff format --check --diff

      - name: Run Type Checker
        run: ty check

      - name: Run Typos
        run: typos
