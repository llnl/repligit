name: Linting & Style Checks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/requirements/unit-tests.txt
            .github/workflows/requirements/style.txt

      - name: Install Python dependencies
        run: |
          pip install -r .github/workflows/requirements/unit-tests.txt
          pip install -r .github/workflows/requirements/style.txt
          pip install -e .[aiohttp]

      - name: Run Ruff
        run: |
          ruff check --diff
          ruff check --select I --diff
          ruff format --check --diff

      - name: Run Type Checker
        run: ty check

      - name: Run Typos
        run: typos
